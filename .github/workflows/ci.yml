name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Free-only policy: hosted runners are free only on public repositories.
  # On a private repository every job is skipped before a runner is requested.
  branch-name:
    name: Branch convention
    if: >-
      github.event_name == 'pull_request' &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Validate feature/bug/fix/chore/perf/improv prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" =~ ^(feature|bug|fix|chore|perf|improv|release|hotfix)/[a-z0-9._-]+$ ]]; then
            echo "✅ Branch name follows the convention"
          else
            echo "❌ Use feature/, bug/, fix/, chore/, perf/, improv/, release/ or hotfix/ prefix"
            exit 1
          fi

  workflows:
    name: Workflow configuration
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Validate workflow YAML and reusable workflow references
        run: bun run check:workflows
      - name: Exercise every TUI menu action
        run: bun run test:tui

  go:
    name: Go venue server
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Unit + property + simulation tests
        run: go test ./... -count=1
      - name: Race detector
        run: go test -race ./...
      - name: Build
        run: go build -o bin/j3d ./cmd/j3d
      - uses: actions/upload-artifact@v7
        with:
          name: j3d-${{ github.sha }}
          path: bin/j3d

  web:
    name: Web (Bun)
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --cwd web --frozen-lockfile
      - name: Type check
        run: bun run --cwd web check
      - name: Unit tests
        run: bun run --cwd web test
      - name: Verify generated types are current
        run: |
          bun run generate:types
          git diff --exit-code -- web/src/lib/api-types.d.ts
      - name: Production build
        run: bun run --cwd web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build-${{ github.sha }}
          path: web/build

  smoke:
    name: End-to-end smoke
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --cwd web --frozen-lockfile
      - name: Full-stack smoke suite (seeded tournament)
        run: bun run smoke:full

  load:
    name: Load & stability
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Start venue server
        run: |
          go build -o /tmp/j3-load-bin ./cmd/j3d
          /tmp/j3-load-bin -addr 127.0.0.1:8787 -db /tmp/j3-load.db -seed > /tmp/j3-load-server.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/j3-load-server.log
          exit 1
      - name: 200 concurrent requests
        run: bun run load

  e2e:
    name: Browser E2E + accessibility
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --cwd web --frozen-lockfile
      - name: Install Chromium
        run: bunx --cwd web playwright install --with-deps chromium
      - name: Run E2E and axe scans
        run: bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.sha }}
          path: web/test-results
          retention-days: 7

  required-checks:
    name: All checks passed
    if: >-
      always() && github.event.repository.visibility == 'public'
    needs: [branch-name, workflows, go, web, smoke, load, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "❌ A required check did not pass"
              exit 1
            fi
          done
          echo "✅ All required checks passed"
