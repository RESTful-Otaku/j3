name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  # Free-only policy: hosted runners are free only on public repositories.
  # On a private repository every job is skipped before a runner is requested.
  verify:
    name: Verify before release
    if: github.event.repository.visibility == 'public'
    uses: ./.github/workflows/ci.yml

  mobile:
    name: Mobile QA apps
    needs: verify
    if: github.event.repository.visibility == 'public'
    uses: ./.github/workflows/mobile.yml
    with:
      # Every tag publishes installable hosted clients plus QA apps. The public
      # API URL comes from the J3_SERVER_URL repository variable (same-origin
      # when blank). Signed IPA/keystore secrets add real-device builds when
      # configured, but do not gate an otherwise valid release.
      build_production: true
      server_url: ${{ vars.J3_SERVER_URL }}
      version: ${{ github.ref_name }}
      require_signed_ios: false
    secrets: inherit

  package:
    name: Hosted server executable
    needs: [verify, mobile]
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Build production server executable
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o dist/j3-server-linux-amd64 ./cmd/j3d
          test -x dist/j3-server-linux-amd64
          echo "✅ Hosted server executable built"
      - uses: actions/upload-artifact@v7
        with:
          name: j3-server-release-${{ github.sha }}
          path: dist/j3-server-linux-amd64
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, mobile, package]
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Download server executable
        uses: actions/download-artifact@v8
        with:
          name: j3-server-release-${{ github.sha }}
          path: artifacts
      - name: Download Android client
        uses: actions/download-artifact@v8
        with:
          name: j3-android-release-${{ github.sha }}
          path: artifacts
      - name: Download iOS client
        uses: actions/download-artifact@v8
        with:
          name: j3-ios-production-${{ github.sha }}
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          # GitHub auto-attaches "Source code (zip/tar.gz)" for every release.
          # Only the hosted server executable, production APK and simulator .app
          # are uploaded here, matching the published-asset policy.
          files: |
            artifacts/j3-server-linux-amd64
            artifacts/j3-android-*.apk
            artifacts/j3-ios-*.app.zip
          generate_release_notes: true
          draft: false
