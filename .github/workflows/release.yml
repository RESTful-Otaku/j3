name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  verify:
    name: Verify before release
    uses: ./.github/workflows/ci.yml

  mobile:
    name: Mobile QA apps
    needs: verify
    uses: ./.github/workflows/mobile.yml
    with:
      # Unsigned simulator .app is always produced. Signed IPA is added when
      # Apple secrets are configured. Tagged releases must not be blocked when
      # an operator has not supplied device-signing credentials.
      require_signed_ios: false
    secrets: inherit

  package:
    name: Production server & web client
    needs: [verify, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --cwd web --frozen-lockfile
      - name: Build production server binaries
        run: |
          mkdir -p dist/bin dist/web
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/bin/j3d-linux-amd64 ./cmd/j3d
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/bin/j3d-linux-arm64 ./cmd/j3d
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/bin/j3d-darwin-arm64 ./cmd/j3d
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/bin/j3d-windows-amd64.exe ./cmd/j3d
      - name: Build final production web client
        run: |
          bun run sync:api-docs
          bun run --cwd web build
          cp -R web/build/. dist/web/
          cp LICENSE dist/LICENSE
      - name: Verify production bundle
        run: |
          test -x dist/bin/j3d-linux-amd64
          test -x dist/bin/j3d-linux-arm64
          test -x dist/bin/j3d-darwin-arm64
          test -f dist/bin/j3d-windows-amd64.exe
          test -f dist/web/index.html
          test -f dist/web/openapi.yaml
          test -f dist/web/docs/manifest.json
          test -f dist/web/docs/HOSTING.md
          test -f dist/web/docs/hosting.html
          test -f dist/LICENSE
          tar -czf "dist/j3-production-${GITHUB_SHA::7}.tar.gz" -C dist bin web LICENSE
          test -s "dist/j3-production-${GITHUB_SHA::7}.tar.gz"
          echo "✅ Production server, client, API, docs site and licence are packaged"
      - uses: actions/upload-artifact@v7
        with:
          name: j3-production-release-${{ github.sha }}
          path: dist/j3-production-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-production-${{ github.sha }}
          path: dist

  publish:
    name: Publish GitHub release
    needs: [verify, mobile, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: j3-*
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
