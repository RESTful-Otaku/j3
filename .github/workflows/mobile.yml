name: Mobile builds

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_production:
        description: Build hosted production APK/app as well as QA apps
        type: boolean
        default: false
      server_url:
        description: Public HTTPS API URL baked into production clients (blank = same origin)
        type: string
        default: ''
      version:
        description: Version label for production artifacts (e.g. 1.2.3)
        type: string
        default: ''
  workflow_call:
    inputs:
      require_signed_ios:
        description: Fail the build when real-device iOS signing secrets are missing
        type: boolean
        default: false
      build_production:
        description: Build hosted production APK/app as well as QA apps
        type: boolean
        default: false
      server_url:
        description: Public HTTPS API URL baked into production clients (blank = same origin)
        type: string
        default: ''
      version:
        description: Version label for production artifacts (e.g. 1.2.3)
        type: string
        default: ''
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_PROVISIONING_PROFILE:
        required: false
      APPLE_PROVISIONING_PROFILE_NAME:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_EXPORT_METHOD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

concurrency:
  group: mobile-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Free-only policy: hosted runners are free only on public repositories.
  # On a private repository every job is skipped before a runner is requested.
  android:
    name: Android QA + hosted APK
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('web/android/gradle/wrapper/gradle-wrapper.properties') }}
      - run: bun install --cwd web --frozen-lockfile
      - name: Compute artifact version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then VERSION="$(jq -r .version web/package.json)"; fi
          CODE="$(printf '%s' "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Android client version $VERSION ($CODE)"
      - name: Generate bundled offline QA data
        run: bash scripts/mobile-demo-data.sh
      - name: Build web app with bundled offline demo data
        env:
          VITE_OFFLINE_DEMO: '1'
          VITE_QA_AUTOLOGIN: '1'
        run: bun run --cwd web build
      - run: bunx --cwd web cap sync android
      - name: Build debug QA APK
        working-directory: web/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Copy QA APK
        run: |
          mkdir -p artifacts
          cp web/android/app/build/outputs/apk/debug/app-debug.apk artifacts/j3-android-qa.apk
          ls -lh artifacts/j3-android-qa.apk
      - name: Upload Android QA APK
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: j3-android-qa-${{ github.sha }}
          path: artifacts/j3-android-qa.apk
          if-no-files-found: error
      - name: Retry Android QA APK upload
        if: steps.upload_apk.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: j3-android-qa-${{ github.sha }}
          path: artifacts/j3-android-qa.apk
          if-no-files-found: error
      - name: Build hosted production APK
        if: inputs.build_production
        env:
          VITE_API_BASE_URL: ${{ inputs.server_url }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${VITE_API_BASE_URL:-}" ]; then
            echo "Baking hosted API URL into production client"
          else
            echo "No J3_SERVER_URL set; production client uses same-origin API"
          fi
          bun run --cwd web build
          bunx --cwd web cap sync android
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/j3-release.keystore"
            export J3_ANDROID_KEYSTORE="$RUNNER_TEMP/j3-release.keystore"
            export J3_ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:-}"
            export J3_ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-j3}"
            export J3_ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "::warning::ANDROID_KEYSTORE secrets not set; using the runner debug keystore for the release APK"
          fi
          export J3_VERSION_NAME="${{ steps.version.outputs.name }}"
          export J3_VERSION_CODE="${{ steps.version.outputs.code }}"
          cd web/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Copy hosted production APK
        if: inputs.build_production
        run: |
          cp web/android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/j3-android-${{ steps.version.outputs.name }}.apk"
          ls -lh "artifacts/j3-android-${{ steps.version.outputs.name }}.apk"
      - name: Upload hosted production APK
        if: inputs.build_production
        uses: actions/upload-artifact@v7
        with:
          name: j3-android-release-${{ github.sha }}
          path: artifacts/j3-android-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM acceleration enabled"
          else
            echo "::warning::/dev/kvm unavailable; emulator will use software rendering"
          fi
      - name: Create Android test AVD
        run: |
          export ANDROID_SDK_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_SDK_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd -n j3-ci \
            -k 'system-images;android-35;google_apis;x86_64' -d pixel --force
          echo "AVDs in $ANDROID_AVD_HOME:"
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/j3-ci.ini"
      - name: Start Android emulator
        run: |
          nohup emulator -avd j3-ci -no-snapshot -no-audio -no-boot-anim -no-window \
            -gpu off > /tmp/j3-emulator.log 2>&1 &
          for _ in $(seq 1 300); do
            if adb get-state 2>/dev/null | tr -d '\r' | grep -q '^device$'; then
              if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q 1; then
                echo "Emulator booted"
                exit 0
              fi
            fi
            # The modern emulator launcher execs qemu-system, so pgrep -f on the
            # launcher command line is unreliable. Poll adb until boot completes;
            # the 10-minute loop is the authoritative timeout.
            sleep 2
          done
          cat /tmp/j3-emulator.log
          adb devices -l
          echo "Emulator did not boot in time"
          exit 1
      - name: Install, launch and verify QA APK
        env:
          J3_APK: artifacts/j3-android-qa.apk
          J3_MOBILE_SMOKE_OUT: artifacts/android-smoke
        run: bash scripts/mobile-smoke.sh
      - name: Install, launch and verify hosted APK
        if: inputs.build_production
        env:
          J3_APK: artifacts/j3-android-${{ steps.version.outputs.name }}.apk
          J3_MOBILE_SMOKE_OUT: artifacts/android-production-smoke
        run: bash scripts/mobile-smoke.sh
      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: j3-android-smoke-${{ github.sha }}
          path: |
            artifacts/android-smoke
            artifacts/android-production-smoke
          if-no-files-found: warn

  ios:
    name: iOS QA + hosted app
    if: github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: bun install --cwd web --frozen-lockfile
      - name: Compute artifact version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then VERSION="$(jq -r .version web/package.json)"; fi
          CODE="$(printf '%s' "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "iOS client version $VERSION ($CODE)"
      - name: Generate bundled offline QA data
        run: bash scripts/mobile-demo-data.sh
      - name: Build web app with bundled offline demo data
        env:
          VITE_OFFLINE_DEMO: '1'
          VITE_QA_AUTOLOGIN: '1'
        run: bun run --cwd web build
      - run: bunx --cwd web cap sync ios
      - name: Build unsigned simulator app
        working-directory: web/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath ../../../build/ios-qa CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS QA app
        run: |
          mkdir -p artifacts
          cp -R build/ios-qa/Build/Products/Debug-iphonesimulator/App.app artifacts/J3.app
          cd artifacts && zip -r ../j3-ios-qa-app.zip J3.app
      - name: Upload iOS QA app
        id: upload_ios_sim
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: j3-ios-simulator-${{ github.sha }}
          path: j3-ios-qa-app.zip
          if-no-files-found: error
      - name: Retry iOS QA app upload
        if: steps.upload_ios_sim.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: j3-ios-simulator-${{ github.sha }}
          path: j3-ios-qa-app.zip
          if-no-files-found: error
      - name: Build hosted production web bundle
        if: inputs.build_production
        env:
          VITE_API_BASE_URL: ${{ inputs.server_url }}
        run: |
          if [ -n "${VITE_API_BASE_URL:-}" ]; then
            echo "Baking hosted API URL into production client"
          else
            echo "No J3_SERVER_URL set; production client uses same-origin API"
          fi
          bun run --cwd web build
          bunx --cwd web cap sync ios
      - name: Build hosted production simulator app
        if: inputs.build_production
        working-directory: web/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath ../../../build/ios-production CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.code }}" build
      - name: Package hosted production app
        if: inputs.build_production
        run: |
          cp -R build/ios-production/Build/Products/Release-iphonesimulator/App.app \
            artifacts/J3-production.app
          cd artifacts && zip -r "../j3-ios-${{ steps.version.outputs.name }}.app.zip" J3-production.app
      - name: Upload hosted production app
        if: inputs.build_production
        uses: actions/upload-artifact@v7
        with:
          name: j3-ios-production-${{ github.sha }}
          path: j3-ios-${{ steps.version.outputs.name }}.app.zip
          if-no-files-found: error
      - name: Boot simulator, install and launch native clients
        run: |
          mkdir -p artifacts/ios-smoke
          SIM_ID=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone .* \((Shutdown|Booted)\)' \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' | head -1)
          if [ -z "$SIM_ID" ]; then
            echo "No suitable iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $SIM_ID"
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          BOOTED=no
          for _ in $(seq 1 150); do
            if xcrun simctl list devices | grep "$SIM_ID" | grep -q 'Booted'; then BOOTED=yes; break; fi
            sleep 2
          done
          if [ "$BOOTED" != "yes" ]; then
            echo "Simulator did not boot"
            xcrun simctl list devices available
            exit 1
          fi
          smoke_app() {
            local app="$1" label="$2" bundle="com.j3.tournaments"
            xcrun simctl uninstall "$SIM_ID" "$bundle" 2>/dev/null || true
            xcrun simctl install "$SIM_ID" "$app"
            local launch_output
            launch_output=$(xcrun simctl launch "$SIM_ID" "$bundle" 2>&1 || true)
            echo "$launch_output"
            sleep 8
            xcrun simctl io "$SIM_ID" screenshot "artifacts/ios-smoke/${label}.png"
            test -s "artifacts/ios-smoke/${label}.png"
          }
          smoke_app artifacts/J3.app ios-qa
          if [ -d artifacts/J3-production.app ]; then
            smoke_app artifacts/J3-production.app ios-production
          fi
          echo "Native clients launched on iOS simulator"
      - name: Upload iOS smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: j3-ios-smoke-${{ github.sha }}
          path: artifacts/ios-smoke
          if-no-files-found: warn
      - name: Build signed production iOS IPA for real devices
        if: inputs.build_production
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          PROFILE_NAME_HINT: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.APPLE_EXPORT_METHOD }}
          REQUIRE_SIGNED: ${{ inputs.require_signed_ios == true }}
        run: |
          if [ -z "${CERT_B64:-}" ] || [ -z "${PROFILE_B64:-}" ] || [ -z "${TEAM_ID:-}" ]; then
            if [ "${REQUIRE_SIGNED:-false}" = "true" ]; then
              echo "::error::iOS signed IPA requires APPLE_CERTIFICATE_P12, APPLE_PROVISIONING_PROFILE and APPLE_TEAM_ID secrets"
              exit 1
            fi
            echo "ℹ️ Apple signing secrets not configured — simulator app only"
            exit 0
          fi
          KEYCHAIN="$HOME/j3-build.keychain"
          security create-keychain -p j3ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p j3ci "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > /tmp/j3-cert.p12
          security import /tmp/j3-cert.p12 -k "$KEYCHAIN" -P "${CERT_PASSWORD:-}" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k j3ci "$KEYCHAIN"
          echo "$PROFILE_B64" | base64 --decode > /tmp/j3.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/j3.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/j3.mobileprovision"
          PROFILE_NAME="${PROFILE_NAME_HINT:-}"
          if [ -z "$PROFILE_NAME" ]; then
            PROFILE_NAME=$(security cms -D -i /tmp/j3.mobileprovision | plutil -extract Name raw -o - -)
          fi
          METHOD="${EXPORT_METHOD:-ad-hoc}"
          cat > /tmp/j3-export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>${METHOD}</string><key>teamID</key><string>${TEAM_ID}</string></dict></plist>
          PLIST
          cd web/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath ../../../build/App.xcarchive archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.code }}"
          xcodebuild -exportArchive -archivePath ../../../build/App.xcarchive \
            -exportPath ../../../build/export -exportOptionsPlist /tmp/j3-export.plist
          cd "$GITHUB_WORKSPACE"
          cp build/export/*.ipa "artifacts/j3-ios-${{ steps.version.outputs.name }}.ipa"
          ls -lh "artifacts/j3-ios-${{ steps.version.outputs.name }}.ipa"
      - name: Upload signed production IPA
        if: hashFiles('artifacts/*.ipa') != ''
        uses: actions/upload-artifact@v7
        with:
          name: j3-ios-release-${{ github.sha }}
          path: artifacts/*.ipa
          if-no-files-found: error

  required-checks:
    name: Mobile checks passed
    if: >-
      always() && github.event.repository.visibility == 'public'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Verify mobile jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "❌ A required mobile check did not pass"
              exit 1
            fi
          done
          echo "✅ Mobile build, QA app, runtime smoke and hosted client checks passed"
