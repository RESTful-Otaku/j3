server {
  listen 8080;
  server_name _;
  root /srv/j3;
  index index.html;

  # Same-origin API keeps browser clients on one host; SSE needs unbuffered proxying.
  location /api/ {
    proxy_pass http://j3-qa-api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location = /healthz { proxy_pass http://j3-qa-api:8787; }
  location = /readyz  { proxy_pass http://j3-qa-api:8787; }

  location / {
    try_files $uri $uri.html $uri/ /200.html;
  }
}
