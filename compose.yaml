# Full seeded QA demo by default. For other seeds use scripts/qa-docker.sh,
# which speaks Docker or Podman directly and needs no Compose provider.
services:
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: j3-qa-api:local
    command: ["reset", "-okami", "-full", "-db", "/data/j3.db"]
    volumes:
      - qa-data:/data

  simulate:
    image: j3-qa-api:local
    command: ["simulate", "-seed", "42", "-fighters", "50", "-out", "/data/simulation.json"]
    volumes:
      - qa-data:/data
    depends_on:
      - seed

  api:
    image: j3-qa-api:local
    environment:
      J3_ADDR: 0.0.0.0:8787
      J3_DB: /data/j3.db
      J3_DEMO: "1"
      J3_VERSION: demo
      J3_SEED_DEMO: "0"
    ports:
      - "${J3_API_PORT:-8787}:8787"
    volumes:
      - qa-data:/data
    depends_on:
      seed:
        condition: service_completed_successfully
      simulate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: prod
    image: j3-qa-web:local
    ports:
      - "${J3_WEB_PORT:-5173}:8080"
    depends_on:
      - api

volumes:
  qa-data:
